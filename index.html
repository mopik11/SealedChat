<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>SecureChat | E2EE</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="login-container" class="glass-panel">
        <h1>SecureChat</h1>
        <p class="subtitle">Vícenásobně šifrovaná komunikace (E2EE)</p>
        
        <div class="input-group">
            <input type="text" id="username-input" placeholder="Tvoje přezdívka" autocomplete="off">
        </div>
        <div class="input-group">
            <input type="password" id="password-input" placeholder="Heslo místnosti (Šifrovací klíč)" autocomplete="off">
        </div>
        <button id="join-btn">Vstoupit do chatu</button>
        <p class="security-note">🔒 Zprávy jsou šifrovány vícenásobně (AES-GCM + AES-CBC) na straně klienta. Server nemá k datům přístup.</p>
    </div>

    <div id="chat-container" class="hidden glass-panel">
        <div class="chat-header">
            <h2>SecureChat <span class="badge">E2EE Aktivní</span></h2>
            <div class="status-indicator" id="status-indicator"></div>
        </div>
        <div class="messages-wrapper" id="messages-container">
            <!-- Zprávy -->
        </div>
        <div class="input-area">
            <input type="text" id="message-input" placeholder="Napiš bezpečnou zprávu..." autocomplete="off">
            <button id="send-btn">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="css-i6dzq1"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>
    <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1/index.js"></script>
    <div id="emoji-picker-modal" class="hidden glass-panel">
        <div style="display: flex; justify-content: flex-end; margin-bottom: 0.5rem;">
            <button id="close-picker-btn" style="width: auto; padding: 0.2rem 0.5rem; background: rgba(255,255,255,0.1);">Zavřít</button>
        </div>
        <emoji-picker class="dark"></emoji-picker>
    </div>
    <script src="main.js"></script>
</body>
</html>
